      // --- MAIN APP COMPONENT ---

        // Core States
        const [artworks, setArtworks] = useState(INITIAL_ARTWORKS);
        const [currency, setCurrency] = useState('INR'); // 'INR' or 'USD'
        const [selectedCategory, setSelectedCategory] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [sortBy, setSortBy] = useState('featured');
        const [wishlist, setWishlist] = useState([]);
        const [cart, setCart] = useState([]);
        
        // Modals & Drawers
        const [selectedArtwork, setSelectedArtwork] = useState(null); // Detail Modal
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isSellModalOpen, setIsSellModalOpen] = useState(false);
        const [isCommissionModalOpen, setIsCommissionModalOpen] = useState(false);
        const [commissionArtist, setCommissionArtist] = useState(null);
        const [toastMessage, setToastMessage] = useState(null);
        
        // Checkout flow state inside Cart drawer
        const [checkoutStep, setCheckoutStep] = useState('cart'); // 'cart', 'checkout', 'success'
        const [buyerInfo, setBuyerInfo] = useState({ name: '', email: '', address: '', note: '' });

        // Toast trigger helper
        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(null), 3500);
        };

        // Currency Formatter Helper
        const formatPrice = (priceINR) => {
          if (currency === 'USD') {
            const usd = Math.round(priceINR / 83);
            return `$${usd.toLocaleString('en-US')}`;
          }
          return `₹${priceINR.toLocaleString('en-IN')}`;
        };

        // Filtered & Sorted Artworks Calculation
        const filteredArtworks = useMemo(() => {
          return artworks.filter(item => {
            const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
            const matchesSearch = searchQuery === '' || 
              item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.artist.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.medium.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.location.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          }).sort((a, b) => {
            if (sortBy === 'price-low') return a.priceINR - b.priceINR;
            if (sortBy === 'price-high') return b.priceINR - a.priceINR;
            if (sortBy === 'featured') return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
            return 0;
          });
        }, [artworks, selectedCategory, searchQuery, sortBy]);

        // Cart Logic
        const addToCart = (artwork, e) => {
          if (e) e.stopPropagation();
          setCart(prev => {
            const existing = prev.find(i => i.id === artwork.id);
            if (existing) {
              return prev.map(i => i.id === artwork.id ? { ...i, qty: i.qty + 1 } : i);
            }
            return [...prev, { ...artwork, qty: 1 }];
          });
          showToast(`"${artwork.title}" added to your collection cart`);
        };

        const updateCartQty = (id, delta) => {
          setCart(prev => prev.map(item => {
            if (item.id === id) {
              const newQty = item.qty + delta;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean));
        };

        const removeFromCart = (id) => {
          setCart(prev => prev.filter(item => item.id !== id));
